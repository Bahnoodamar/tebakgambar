<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Random Gallery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #progress-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #progress-track.visible {
      opacity: 1;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      will-change: width;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform, opacity;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 16px 16px;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    #ui-overlay.hidden {
      visibility: hidden;
      opacity: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 999px;
      align-self: center;
    }

    #countdown-badge, #zoom-badge {
      display: none;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      padding-left: 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    #countdown-badge.visible, #zoom-badge.visible {
      display: inline-block;
    }

    #countdown-badge {
      color: #93c5fd;
    }

    #zoom-badge {
      color: #fde047;
    }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #caption {
      font-size: 14px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 8px;
      max-width: 90%;
    }

    #caption:empty {
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    button {
      pointer-events: auto;
      touch-action: manipulation;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    button:active {
      background: rgba(255, 255, 255, 0.3);
    }

    button.active {
      background: rgba(59, 130, 246, 0.78);
      border-color: rgba(147, 197, 253, 0.9);
    }

    #status {
      position: absolute;
      font-size: 14px;
      color: #ccc;
      text-align: center;
      padding: 20px;
      max-width: 85%;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="progress-track">
    <div id="progress-fill"></div>
  </div>

  <div id="viewer">
    <div id="status">Memuat daftar gambar...</div>
    <img id="current-img" class="slide-img" src="" alt="" style="display: none;">
  </div>

  <div id="ui-overlay">
    <div class="top-bar">
      <span id="counter">0 gambar</span>
      <span id="zoom-badge">1.0x</span>
      <span id="countdown-badge">5.0s</span>
    </div>
    <div class="bottom-bar">
      <div id="caption"></div>
      <div class="controls">
        <button id="btn-prev" type="button">← Prev</button>
        <button id="btn-next" type="button">Acak →</button>
        <button id="btn-auto" type="button">Auto: Off (5s)</button>
        <button id="btn-zoom-in" type="button">Zoom +</button>
        <button id="btn-reset-zoom" type="button" style="display: none;">Reset</button>
        <button id="btn-reload" type="button">Reload</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSR9dtUCx-BGcNC26gGzEF6BlGvLrm6ws4lyOl-IqvHWTkSaUZVezSf9KWiYZ1yc3WTRKB-yUs7ONs0/pub?gid=0&single=true&output=csv';
    const AUTO_DELAY_MS = 5000;
    const MIN_SCALE = 1;
    const MAX_SCALE = 4;

    let allItems = [];
    let shuffleDeck = [];
    let historyStack = [];
    let historyIndex = -1;
    let nextBuffer = null;
    let loading = false;
    let gestureActive = false;
    let imageReady = false;

    let isAutoEnabled = false;
    let autoRafId = null;
    let autoStartTime = 0;

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const viewer = document.getElementById('viewer');
    const imgEl = document.getElementById('current-img');
    const statusEl = document.getElementById('status');
    const counterEl = document.getElementById('counter');
    const zoomBadge = document.getElementById('zoom-badge');
    const countdownBadge = document.getElementById('countdown-badge');
    const captionEl = document.getElementById('caption');
    const uiOverlay = document.getElementById('ui-overlay');
    const btnAuto = document.getElementById('btn-auto');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnResetZoom = document.getElementById('btn-reset-zoom');
    const btnReload = document.getElementById('btn-reload');
    const progressTrack = document.getElementById('progress-track');
    const progressFill = document.getElementById('progress-fill');

    function setStatus(msg) {
      statusEl.style.display = 'block';
      statusEl.textContent = msg;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], col = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(col.trim()); col = ''; }
        else if ((c === '\n' || (c === '\r' && next === '\n')) && !inQuotes) {
          if (c === '\r') i++;
          row.push(col.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = []; col = '';
        } else { col += c; }
      }
      if (col || row.length) { row.push(col.trim()); rows.push(row); }
      return rows;
    }

    function clampPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }
      const maxPanX = Math.max(0, (scale * imgEl.offsetWidth - viewer.clientWidth) / 2);
      const maxPanY = Math.max(0, (scale * imgEl.offsetHeight - viewer.clientHeight) / 2);
      translateX = Math.max(-maxPanX, Math.min(maxPanX, translateX));
      translateY = Math.max(-maxPanY, Math.min(maxPanY, translateY));
    }

    function applyTransform(withTransition = false) {
      clampPan();
      imgEl.style.transition = withTransition
        ? 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease'
        : 'none';
      imgEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

      const isZoomed = scale > 1.02;
      zoomBadge.textContent = `${scale.toFixed(1)}x`;
      zoomBadge.classList.toggle('visible', isZoomed);
      btnResetZoom.style.display = isZoomed ? 'inline-block' : 'none';

      if (isAutoEnabled) {
        if (isZoomed || gestureActive) {
          stopAutoProgress(true);
          btnAuto.textContent = "Auto: Jeda";
        } else if (autoRafId === null) {
          startAutoProgress();
        }
      }
    }

    function zoomStep() {
      const next = scale >= 3 ? 1 : Math.min(MAX_SCALE, +(scale + 0.8).toFixed(1));
      if (next <= 1.02) {
        resetZoom(true);
      } else {
        scale = next;
        applyTransform(true);
      }
    }

    function resetZoom(withTransition = true) {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform(withTransition);
    }

    function buildShuffledDeck(excludeIdx = -1) {
      const indices = [];
      for (let i = 0; i < allItems.length; i++) {
        indices.push(i);
      }
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      if (indices.length > 1 && indices[indices.length - 1] === excludeIdx) {
        [indices[indices.length - 1], indices[0]] = [indices[0], indices[indices.length - 1]];
      }
      shuffleDeck = indices;
    }

    function drawFromDeck(excludeIdx = -1) {
      if (allItems.length === 0) return -1;
      if (shuffleDeck.length === 0) {
        buildShuffledDeck(excludeIdx);
      }
      let idx = shuffleDeck.pop();
      if (idx === excludeIdx && shuffleDeck.length > 0) {
        const alt = shuffleDeck.pop();
        shuffleDeck.unshift(idx);
        idx = alt;
      }
      return idx;
    }

    function prepareNextRandom(currentIdx) {
      if (allItems.length <= 1) {
        nextBuffer = 0;
        return;
      }
      const nextIdx = drawFromDeck(currentIdx);
      nextBuffer = nextIdx;
      const preloader = new Image();
      preloader.src = allItems[nextIdx].url;
    }

    function stopAutoProgress(hideBar = false) {
      if (autoRafId !== null) {
        cancelAnimationFrame(autoRafId);
        autoRafId = null;
      }
      if (hideBar) {
        progressFill.style.width = '0%';
        progressTrack.classList.remove('visible');
        countdownBadge.classList.remove('visible');
      }
    }

    function startAutoProgress() {
      stopAutoProgress(false);
      if (!isAutoEnabled || loading || gestureActive || allItems.length === 0 || scale > 1.02 || document.hidden) {
        if (!isAutoEnabled) {
          progressTrack.classList.remove('visible');
          countdownBadge.classList.remove('visible');
        }
        return;
      }

      progressTrack.classList.add('visible');
      countdownBadge.classList.add('visible');
      autoStartTime = performance.now();

      function tick(now) {
        if (!isAutoEnabled || loading || gestureActive || scale > 1.02 || document.hidden) {
          autoRafId = null;
          return;
        }
        const elapsed = now - autoStartTime;
        const ratio = Math.min(elapsed / AUTO_DELAY_MS, 1);
        const remainingSec = Math.max((AUTO_DELAY_MS - elapsed) / 1000, 0).toFixed(1);

        progressFill.style.width = `${ratio * 100}%`;
        countdownBadge.textContent = `${remainingSec}s`;
        btnAuto.textContent = `Auto: On (${remainingSec}s)`;

        if (elapsed >= AUTO_DELAY_MS) {
          goNext();
        } else {
          autoRafId = requestAnimationFrame(tick);
        }
      }

      autoRafId = requestAnimationFrame(tick);
    }

    function toggleAutoMode() {
      isAutoEnabled = !isAutoEnabled;
      btnAuto.classList.toggle('active', isAutoEnabled);

      if (isAutoEnabled) {
        btnAuto.textContent = "Auto: Jeda";
        startAutoProgress();
      } else {
        stopAutoProgress(true);
        btnAuto.textContent = 'Auto: Off (5s)';
      }
    }

    function renderSlide(itemIdx, direction = 'none') {
      const item = allItems[itemIdx];
      if (!item) return;
      imageReady = false;
      setStatus("Memuat gambar...");
      imgEl.style.display = "none";
      imgEl.style.transform = "none";
      imgEl.style.opacity = "1";

      scale = 1;
      translateX = 0;
      translateY = 0;
      zoomBadge.classList.remove('visible');
      btnResetZoom.style.display = 'none';

      if (direction === 'next') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(40px) scale(1)';
        imgEl.style.opacity = '0.3';
      } else if (direction === 'prev') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(-40px) scale(1)';
        imgEl.style.opacity = '0.3';
      }

      imgEl.onload = () => {
        statusEl.style.display = 'none';
        imageReady = true;
        imgEl.style.display = 'block';
        requestAnimationFrame(() => {
          imgEl.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease';
          imgEl.style.transform = 'translate(0px, 0px) scale(1)';
          imgEl.style.opacity = '1';
        });
        startAutoProgress();
      };

      imgEl.onerror = () => {
        setStatus(`Gagal memuat gambar:\n${item.url}`);
        imgEl.style.display = 'none';
        startAutoProgress();
      };

      imgEl.src = item.url;
      captionEl.textContent = item.caption || '';

      const remainingInCycle = shuffleDeck.length + (nextBuffer !== null ? 1 : 0);
      counterEl.textContent = `Riwayat #${historyIndex + 1} • Sisa siklus: ${remainingInCycle}/${allItems.length}`;
    }

    function goNext() {
      if (loading || allItems.length === 0) return;
      stopAutoProgress(false);
      progressFill.style.width = '0%';

      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        renderSlide(historyStack[historyIndex], 'next');
        return;
      }

      const currentIdx = historyIndex >= 0 ? historyStack[historyIndex] : -1;
      const chosenIdx = (nextBuffer !== null && nextBuffer !== currentIdx)
        ? nextBuffer
        : drawFromDeck(currentIdx);

      nextBuffer = null;
      historyStack.push(chosenIdx);
      historyIndex = historyStack.length - 1;
      renderSlide(chosenIdx, 'next');
      prepareNextRandom(chosenIdx);
    }

    function goPrev() {
      if (loading || allItems.length === 0) return;
      stopAutoProgress(false);
      progressFill.style.width = '0%';

      if (historyIndex > 0) {
        historyIndex--;
        renderSlide(historyStack[historyIndex], 'prev');
      } else {
        const currentIdx = historyStack.length ? historyStack[0] : -1;
        const chosenIdx = nextBuffer !== null ? nextBuffer : drawFromDeck(currentIdx);
        nextBuffer = null;
        historyStack.unshift(chosenIdx);
        renderSlide(chosenIdx, 'prev');
      }
    }

    // Gesture layar sentuh: pinch mengikuti titik tengah kedua jari.
    let mode = 'none', pinched = false, x0 = 0, y0 = 0, lastX = 0, lastY = 0;
    let baseDist = 1, baseScale = 1, anchorX = 0, anchorY = 0;
    let tapTimer = null, tapX = 0, tapY = 0, moved = false;
    function midpoint(t) {
      const r = viewer.getBoundingClientRect();
      return { x: (t[0].clientX + t[1].clientX)/2-r.left-r.width/2,
               y: (t[0].clientY + t[1].clientY)/2-r.top-r.height/2 };
    }
    function distance(t) { return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }
    function beginPinch(t) {
      mode = 'pinch'; pinched = true; moved = true;
      clearTimeout(tapTimer); tapTimer = null;
      baseDist = Math.max(1,distance(t)); baseScale = scale;
      const m = midpoint(t);
      anchorX = (m.x-translateX)/scale; anchorY = (m.y-translateY)/scale;
      applyTransform(false);
    }
    viewer.addEventListener('touchstart', function(e) {
      if (!imageReady || loading) return;
      e.preventDefault(); gestureActive = true;
      stopAutoProgress(true);
      if (isAutoEnabled) btnAuto.textContent = 'Auto: Jeda';
      if (e.touches.length >= 2) { beginPinch(e.touches); return; }
      const t = e.touches[0];
      x0 = lastX = t.clientX; y0 = lastY = t.clientY;
      moved = false; pinched = false; mode = scale > 1.02 ? 'pan' : 'swipe';
    }, {passive:false});
    viewer.addEventListener('touchmove', function(e) {
      if (!gestureActive) return;
      e.preventDefault();
      if (e.touches.length >= 2) {
        if (mode !== 'pinch') beginPinch(e.touches);
        const m = midpoint(e.touches);
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, baseScale*distance(e.touches)/baseDist));
        translateX = m.x-anchorX*scale; translateY = m.y-anchorY*scale;
        applyTransform(false); return;
      }
      if (e.touches.length !== 1) return;
      const t = e.touches[0], dx = t.clientX-lastX, dy = t.clientY-lastY;
      lastX = t.clientX; lastY = t.clientY;
      if (Math.hypot(lastX-x0,lastY-y0)>12) moved = true;
      if (mode === 'pan') { translateX += dx; translateY += dy; applyTransform(false); }
      else if (mode === 'swipe' && Math.abs(lastX-x0)>Math.abs(lastY-y0)) {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX('+((lastX-x0)*0.45)+'px)';
      }
    }, {passive:false});
    viewer.addEventListener('touchend', function(e) {
      if (!gestureActive) return;
      if (e.touches.length >= 2) { beginPinch(e.touches); return; }
      if (e.touches.length === 1) {
        lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
        mode='pan'; return;
      }
      gestureActive=false;
      if (!pinched && mode==='swipe' && Math.abs(lastX-x0)>45 && Math.abs(lastX-x0)>Math.abs(lastY-y0)) {
        clearTimeout(tapTimer); tapTimer=null; mode='none';
        if (lastX<x0) goNext(); else goPrev(); return;
      }
      if (scale<=1.06) resetZoom(true); else applyTransform(true);
      if (!pinched && !moved) {
        if (tapTimer !== null && Math.hypot(x0-tapX,y0-tapY)<40) {
          clearTimeout(tapTimer); tapTimer=null;
          if (scale>1.05) resetZoom(true);
          else { scale=2.2; applyTransform(true); }
        } else {
          clearTimeout(tapTimer); tapX=x0; tapY=y0;
          tapTimer=setTimeout(function(){uiOverlay.classList.toggle('hidden');tapTimer=null;},280);
        }
      }
      mode='none';
    }, {passive:false});
    viewer.addEventListener('touchcancel', function(){
      gestureActive=false; mode='none'; pinched=false;
      clearTimeout(tapTimer); tapTimer=null; applyTransform(false);
    });
    window.addEventListener('resize', function(){ if(imageReady) applyTransform(false); });

    document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); goNext(); });
    document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
    btnAuto.addEventListener('click', (e) => { e.stopPropagation(); toggleAutoMode(); });
    btnZoomIn.addEventListener('click', (e) => { e.stopPropagation(); zoomStep(); });
    btnResetZoom.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(true); });
    btnReload.addEventListener('click', (e) => { e.stopPropagation(); init(true); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key.toLowerCase() === 'a') toggleAutoMode();
      if (e.key === '0') resetZoom(true);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoProgress(false);
      } else if (isAutoEnabled && scale <= 1.02) {
        startAutoProgress();
      }
    });

    async function init(forceFresh = false) {
      if (loading) return;
      loading = true;
      stopAutoProgress(true);
      imageReady = false;
      imgEl.style.display = 'none';
      counterEl.textContent = 'Memuat...';
      allItems = [];
      setStatus('Memuat daftar gambar...');
      let timeoutId;

      try {
        const sep = CSV_URL.includes('?') ? '&' : '?';
        const targetUrl = forceFresh ? `${CSV_URL}${sep}_t=${Date.now()}` : CSV_URL;
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const request = fetch(targetUrl, { cache: 'no-store', ...(controller ? {signal: controller.signal} : {}) })
          .then(async response => ({response, text: await response.text()}));
        const timeout = new Promise((resolve, reject) => {
          timeoutId = setTimeout(() => { reject(new Error('Waktu tunggu 15 detik habis. Periksa internet, lalu tekan Reload.')); if (controller) controller.abort(); }, 15000);
        });
        const result = await Promise.race([request, timeout]);
        const res = result.response;

        if (!res.ok) {
          setStatus(`Gagal memuat sheet (HTTP ${res.status}).`);
          return;
        }

        const csvText = result.text;
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          setStatus('Sheet kosong atau format CSV belum sesuai.');
          return;
        }

        const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim().toLowerCase());
        const urlCol = headers.indexOf('url');
        const capCol = headers.indexOf('caption');

        if (urlCol === -1) {
          setStatus(`Header "url" tidak ditemukan di baris 1. Terbaca: ${headers.join(', ')}`);
          return;
        }

        allItems = rows.slice(1)
          .map(r => ({
            url: (r[urlCol] || '').trim(),
            caption: capCol !== -1 ? (r[capCol] || '').trim() : ''
          }))
          .filter(item => /^(https?:)?\/\//i.test(item.url));

        if (allItems.length === 0) {
          setStatus('Tidak ada link gambar valid (http/https) ditemukan di kolom "url".');
          return;
        }

        shuffleDeck = [];
        historyStack = [];
        historyIndex = -1;
        nextBuffer = null;

        buildShuffledDeck(-1);
        loading = false;
        goNext();
      } catch (err) {
        setStatus(`Gagal mengambil data dari Google Sheets: ${err && err.message ? err.message : 'Error jaringan'}`);
      } finally {
        clearTimeout(timeoutId);
        loading = false;
        if (!allItems.length) counterEl.textContent = '0 gambar';
      }
    }

    init(false);
  </script>
</body>
</html>
