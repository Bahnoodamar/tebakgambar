<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Random Gallery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #progress-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      z-index: 50;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #progress-track.visible {
      opacity: 1;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      will-change: width;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform, opacity;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 16px 16px;
      transition: opacity 0.25s ease;
      z-index: 20;
    }

    #ui-overlay.hidden {
      opacity: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 999px;
      align-self: center;
    }

    #countdown-badge, #zoom-badge {
      display: none;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      padding-left: 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    #countdown-badge.visible, #zoom-badge.visible {
      display: inline-block;
    }

    #countdown-badge {
      color: #93c5fd;
    }

    #zoom-badge {
      color: #fde047;
    }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    #caption {
      font-size: 14px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 8px;
      max-width: 90%;
    }

    #caption:empty {
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    button {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    button:active {
      background: rgba(255, 255, 255, 0.3);
    }

    button.active {
      background: rgba(59, 130, 246, 0.78);
      border-color: rgba(147, 197, 253, 0.9);
    }

    #status {
      position: absolute;
      font-size: 14px;
      color: #ccc;
      text-align: center;
      padding: 20px;
      max-width: 85%;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="progress-track">
    <div id="progress-fill"></div>
  </div>

  <div id="viewer">
    <div id="status">Memuat daftar gambar...</div>
    <img id="current-img" class="slide-img" src="" alt="" style="display: none;">
  </div>

  <div id="ui-overlay">
    <div class="top-bar">
      <span id="counter">0 gambar</span>
      <span id="zoom-badge">1.0x</span>
      <span id="countdown-badge">5.0s</span>
    </div>
    <div class="bottom-bar">
      <div id="caption"></div>
      <div class="controls">
        <button id="btn-prev" type="button">← Prev</button>
        <button id="btn-next" type="button">Acak →</button>
        <button id="btn-auto" type="button">Auto: Off (5s)</button>
        <button id="btn-zoom-in" type="button">Zoom +</button>
        <button id="btn-reset-zoom" type="button" style="display: none;">Reset</button>
        <button id="btn-reload" type="button">Reload</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSR9dtUCx-BGcNC26gGzEF6BlGvLrm6ws4lyOl-IqvHWTkSaUZVezSf9KWiYZ1yc3WTRKB-yUs7ONs0/pub?gid=0&single=true&output=csv';
    const AUTO_DELAY_MS = 5000;
    const MIN_SCALE = 1;
    const MAX_SCALE = 4;

    let allItems = [];
    let shuffleDeck = [];
    let historyStack = [];
    let historyIndex = -1;
    let nextBuffer = null;

    let isAutoEnabled = false;
    let autoRafId = null;
    let autoStartTime = 0;

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    const viewer = document.getElementById('viewer');
    const imgEl = document.getElementById('current-img');
    const statusEl = document.getElementById('status');
    const counterEl = document.getElementById('counter');
    const zoomBadge = document.getElementById('zoom-badge');
    const countdownBadge = document.getElementById('countdown-badge');
    const captionEl = document.getElementById('caption');
    const uiOverlay = document.getElementById('ui-overlay');
    const btnAuto = document.getElementById('btn-auto');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnResetZoom = document.getElementById('btn-reset-zoom');
    const btnReload = document.getElementById('btn-reload');
    const progressTrack = document.getElementById('progress-track');
    const progressFill = document.getElementById('progress-fill');

    function setStatus(msg) {
      statusEl.style.display = 'block';
      statusEl.textContent = msg;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], col = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(col.trim()); col = ''; }
        else if ((c === '\n' || (c === '\r' && next === '\n')) && !inQuotes) {
          if (c === '\r') i++;
          row.push(col.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = []; col = '';
        } else { col += c; }
      }
      if (col || row.length) { row.push(col.trim()); rows.push(row); }
      return rows;
    }

    function clampPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }
      const maxPanX = ((scale - 1) * viewer.clientWidth) / 2;
      const maxPanY = ((scale - 1) * viewer.clientHeight) / 2;
      translateX = Math.max(-maxPanX, Math.min(maxPanX, translateX));
      translateY = Math.max(-maxPanY, Math.min(maxPanY, translateY));
    }

    function applyTransform(withTransition = false) {
      clampPan();
      imgEl.style.transition = withTransition
        ? 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease'
        : 'none';
      imgEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

      const isZoomed = scale > 1.02;
      zoomBadge.textContent = `${scale.toFixed(1)}x`;
      zoomBadge.classList.toggle('visible', isZoomed);
      btnResetZoom.style.display = isZoomed ? 'inline-block' : 'none';

      if (isAutoEnabled) {
        if (isZoomed) {
          stopAutoProgress(false);
        } else if (autoRafId === null) {
          startAutoProgress();
        }
      }
    }

    function zoomStep() {
      const next = scale >= 3 ? 1 : Math.min(MAX_SCALE, +(scale + 0.8).toFixed(1));
      if (next <= 1.02) {
        resetZoom(true);
      } else {
        scale = next;
        applyTransform(true);
      }
    }

    function resetZoom(withTransition = true) {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform(withTransition);
    }

    function buildShuffledDeck(excludeIdx = -1) {
      const indices = [];
      for (let i = 0; i < allItems.length; i++) {
        indices.push(i);
      }
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      if (indices.length > 1 && indices[indices.length - 1] === excludeIdx) {
        [indices[indices.length - 1], indices[0]] = [indices[0], indices[indices.length - 1]];
      }
      shuffleDeck = indices;
    }

    function drawFromDeck(excludeIdx = -1) {
      if (allItems.length === 0) return -1;
      if (shuffleDeck.length === 0) {
        buildShuffledDeck(excludeIdx);
      }
      let idx = shuffleDeck.pop();
      if (idx === excludeIdx && shuffleDeck.length > 0) {
        const alt = shuffleDeck.pop();
        shuffleDeck.unshift(idx);
        idx = alt;
      }
      return idx;
    }

    function prepareNextRandom(currentIdx) {
      if (allItems.length <= 1) {
        nextBuffer = 0;
        return;
      }
      const nextIdx = drawFromDeck(currentIdx);
      nextBuffer = nextIdx;
      const preloader = new Image();
      preloader.src = allItems[nextIdx].url;
    }

    function stopAutoProgress(hideBar = false) {
      if (autoRafId !== null) {
        cancelAnimationFrame(autoRafId);
        autoRafId = null;
      }
      if (hideBar) {
        progressFill.style.width = '0%';
        progressTrack.classList.remove('visible');
        countdownBadge.classList.remove('visible');
      }
    }

    function startAutoProgress() {
      stopAutoProgress(false);
      if (!isAutoEnabled || allItems.length === 0 || scale > 1.02) {
        if (!isAutoEnabled) {
          progressTrack.classList.remove('visible');
          countdownBadge.classList.remove('visible');
        }
        return;
      }

      progressTrack.classList.add('visible');
      countdownBadge.classList.add('visible');
      autoStartTime = performance.now();

      function tick(now) {
        if (!isAutoEnabled || scale > 1.02) {
          autoRafId = null;
          return;
        }
        const elapsed = now - autoStartTime;
        const ratio = Math.min(elapsed / AUTO_DELAY_MS, 1);
        const remainingSec = Math.max((AUTO_DELAY_MS - elapsed) / 1000, 0).toFixed(1);

        progressFill.style.width = `${ratio * 100}%`;
        countdownBadge.textContent = `${remainingSec}s`;
        btnAuto.textContent = `Auto: On (${remainingSec}s)`;

        if (elapsed >= AUTO_DELAY_MS) {
          goNext();
        } else {
          autoRafId = requestAnimationFrame(tick);
        }
      }

      autoRafId = requestAnimationFrame(tick);
    }

    function toggleAutoMode() {
      isAutoEnabled = !isAutoEnabled;
      btnAuto.classList.toggle('active', isAutoEnabled);

      if (isAutoEnabled) {
        startAutoProgress();
      } else {
        stopAutoProgress(true);
        btnAuto.textContent = 'Auto: Off (5s)';
      }
    }

    function renderSlide(itemIdx, direction = 'none') {
      const item = allItems[itemIdx];
      if (!item) return;

      scale = 1;
      translateX = 0;
      translateY = 0;
      zoomBadge.classList.remove('visible');
      btnResetZoom.style.display = 'none';

      if (direction === 'next') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(40px) scale(1)';
        imgEl.style.opacity = '0.3';
      } else if (direction === 'prev') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(-40px) scale(1)';
        imgEl.style.opacity = '0.3';
      }

      imgEl.onload = () => {
        statusEl.style.display = 'none';
        imgEl.style.display = 'block';
        requestAnimationFrame(() => {
          imgEl.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease';
          imgEl.style.transform = 'translate(0px, 0px) scale(1)';
          imgEl.style.opacity = '1';
        });
        startAutoProgress();
      };

      imgEl.onerror = () => {
        setStatus(`Gagal memuat gambar:\n${item.url}`);
        imgEl.style.display = 'none';
        startAutoProgress();
      };

      imgEl.src = item.url;
      captionEl.textContent = item.caption || '';

      const remainingInCycle = shuffleDeck.length + (nextBuffer !== null ? 1 : 0);
      counterEl.textContent = `Riwayat #${historyIndex + 1} • Sisa siklus: ${remainingInCycle}/${allItems.length}`;
    }

    function goNext() {
      if (allItems.length === 0) return;
      stopAutoProgress(false);
      progressFill.style.width = '0%';

      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        renderSlide(historyStack[historyIndex], 'next');
        return;
      }

      const currentIdx = historyStack[historyIndex] ?? -1;
      const chosenIdx = (nextBuffer !== null && nextBuffer !== currentIdx)
        ? nextBuffer
        : drawFromDeck(currentIdx);

      nextBuffer = null;
      historyStack.push(chosenIdx);
      historyIndex = historyStack.length - 1;
      renderSlide(chosenIdx, 'next');
      prepareNextRandom(chosenIdx);
    }

    function goPrev() {
      if (allItems.length === 0) return;
      stopAutoProgress(false);
      progressFill.style.width = '0%';

      if (historyIndex > 0) {
        historyIndex--;
        renderSlide(historyStack[historyIndex], 'prev');
      } else {
        const currentIdx = historyStack[0] ?? -1;
        const chosenIdx = drawFromDeck(currentIdx);
        historyStack.unshift(chosenIdx);
        renderSlide(chosenIdx, 'prev');
      }
    }

    // Gesture Pinch-to-Zoom, Pan, Swipe & Double-Tap
    let touchMode = 'none';
    let startX = 0, startY = 0, lastX = 0, lastY = 0;
    let initialPinchDist = 0, initialPinchScale = 1;
    let lastTapTime = 0;
    let movedDistance = 0;
    let didPinchInGesture = false;

    function getTouchDistance(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }

    viewer.addEventListener('touchstart', (e) => {
      if (e.touches.length >= 2) {
        e.preventDefault();
        touchMode = 'pinch';
        didPinchInGesture = true;
        initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
        initialPinchScale = scale;
        movedDistance = 30;
      } else if (e.touches.length === 1) {
        const t = e.touches[0];
        startX = lastX = t.clientX;
        startY = lastY = t.clientY;
        movedDistance = 0;
        didPinchInGesture = false;
        touchMode = scale > 1.02 ? 'pan' : 'swipe';
      }
    }, { passive: false });

    viewer.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2) {
        e.preventDefault();
        if (touchMode !== 'pinch') {
          touchMode = 'pinch';
          didPinchInGesture = true;
          initialPinchDist = getTouchDistance(e.touches[0], e.touches[1]);
          initialPinchScale = scale;
        }
        const dist = getTouchDistance(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0) {
          const nextScale = initialPinchScale * (dist / initialPinchDist);
          scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, nextScale));
          applyTransform(false);
        }
        return;
      }

      if (e.touches.length === 1 && !didPinchInGesture) {
        const t = e.touches[0];
        const dx = t.clientX - lastX;
        const dy = t.clientY - lastY;
        movedDistance += Math.hypot(dx, dy);
        lastX = t.clientX;
        lastY = t.clientY;

        if (touchMode === 'pan' && scale > 1.02) {
          e.preventDefault();
          translateX += dx;
          translateY += dy;
          applyTransform(false);
        } else if (touchMode === 'swipe') {
          const totalDx = t.clientX - startX;
          const totalDy = t.clientY - startY;
          if (Math.abs(totalDx) > Math.abs(totalDy)) {
            imgEl.style.transition = 'none';
            imgEl.style.transform = `translateX(${totalDx * 0.45}px) scale(1)`;
          }
        }
      }
    }, { passive: false });

    viewer.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        if (didPinchInGesture) {
          if (scale <= 1.06) {
            resetZoom(true);
          }
          didPinchInGesture = false;
          touchMode = 'none';
          return;
        }

        if (touchMode === 'swipe') {
          const deltaX = lastX - startX;
          const threshold = 45;
          if (deltaX < -threshold) {
            goNext();
          } else if (deltaX > threshold) {
            goPrev();
          } else {
            imgEl.style.transition = 'transform 0.2s ease';
            imgEl.style.transform = 'translate(0px, 0px) scale(1)';
          }
        }

        if (movedDistance < 12) {
          const now = Date.now();
          if (now - lastTapTime < 280) {
            if (scale > 1.05) {
              resetZoom(true);
            } else {
              scale = 2.2;
              applyTransform(true);
            }
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            setTimeout(() => {
              if (lastTapTime !== 0 && Date.now() - lastTapTime >= 270) {
                uiOverlay.classList.toggle('hidden');
                lastTapTime = 0;
              }
            }, 280);
          }
        }

        touchMode = 'none';
      } else if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        touchMode = scale > 1.02 ? 'pan' : 'none';
      }
    }, { passive: false });

    document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); goNext(); });
    document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
    btnAuto.addEventListener('click', (e) => { e.stopPropagation(); toggleAutoMode(); });
    btnZoomIn.addEventListener('click', (e) => { e.stopPropagation(); zoomStep(); });
    btnResetZoom.addEventListener('click', (e) => { e.stopPropagation(); resetZoom(true); });
    btnReload.addEventListener('click', (e) => { e.stopPropagation(); init(true); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key.toLowerCase() === 'a') toggleAutoMode();
      if (e.key === '0') resetZoom(true);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoProgress(false);
      } else if (isAutoEnabled && scale <= 1.02) {
        startAutoProgress();
      }
    });

    async function init(forceFresh = false) {
      stopAutoProgress(false);
      setStatus('Memuat daftar gambar...');

      try {
        const sep = CSV_URL.includes('?') ? '&' : '?';
        const targetUrl = forceFresh ? `${CSV_URL}${sep}_t=${Date.now()}` : CSV_URL;
        const res = await fetch(targetUrl, { cache: forceFresh ? 'no-store' : 'default' });

        if (!res.ok) {
          setStatus(`Gagal memuat sheet (HTTP ${res.status}).`);
          return;
        }

        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          setStatus('Sheet kosong atau format CSV belum sesuai.');
          return;
        }

        const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim().toLowerCase());
        const urlCol = headers.indexOf('url');
        const capCol = headers.indexOf('caption');

        if (urlCol === -1) {
          setStatus(`Header "url" tidak ditemukan di baris 1. Terbaca: ${headers.join(', ')}`);
          return;
        }

        allItems = rows.slice(1)
          .map(r => ({
            url: (r[urlCol] || '').trim(),
            caption: capCol !== -1 ? (r[capCol] || '').trim() : ''
          }))
          .filter(item => /^(https?:)?\/\//i.test(item.url));

        if (allItems.length === 0) {
          setStatus('Tidak ada link gambar valid (http/https) ditemukan di kolom "url".');
          return;
        }

        shuffleDeck = [];
        historyStack = [];
        historyIndex = -1;
        nextBuffer = null;

        buildShuffledDeck(-1);
        goNext();
      } catch (err) {
        setStatus(`Gagal mengambil data dari Google Sheets: ${err && err.message ? err.message : 'Error jaringan'}`);
      }
    }

    init(false);
  </script>
</body>
</html>
