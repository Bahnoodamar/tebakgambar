<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Random Gallery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: pan-y;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      will-change: transform, opacity;
      pointer-events: none;
    }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      transition: opacity 0.25s ease;
    }

    #ui-overlay.hidden {
      opacity: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 999px;
      align-self: center;
    }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    #caption {
      font-size: 14px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 8px;
      max-width: 90%;
    }

    #caption:empty {
      display: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    button:active {
      background: rgba(255, 255, 255, 0.3);
    }

    button.active {
      background: rgba(59, 130, 246, 0.75);
      border-color: rgba(147, 197, 253, 0.9);
    }

    #status {
      position: absolute;
      font-size: 14px;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="viewer">
    <div id="status">Memuat daftar gambar...</div>
    <img id="current-img" class="slide-img" src="" alt="" style="display: none;">
  </div>

  <div id="ui-overlay">
    <div class="top-bar">
      <span id="counter">0 gambar</span>
    </div>
    <div class="bottom-bar">
      <div id="caption"></div>
      <div class="controls">
        <button id="btn-prev" type="button">← Sebelumnya</button>
        <button id="btn-next" type="button">Acak Berikutnya →</button>
        <button id="btn-auto" type="button">Auto: Off (3s)</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSR9dtUCx-BGcNC26gGzEF6BlGvLrm6ws4lyOl-IqvHWTkSaUZVezSf9KWiYZ1yc3WTRKB-yUs7ONs0/pub?gid=0&single=true&output=csv';
    const AUTO_DELAY_MS = 3000;

    let allItems = [];
    let shuffleDeck = [];    // Antrean indeks acak tanpa ulang dalam 1 siklus
    let historyStack = [];   // Riwayat gambar yang sudah dilihat
    let historyIndex = -1;   // Posisi saat ini di riwayat
    let nextBuffer = null;   // Preload gambar berikutnya
    let autoTimer = null;
    let isAutoEnabled = false;

    const viewer = document.getElementById('viewer');
    const imgEl = document.getElementById('current-img');
    const statusEl = document.getElementById('status');
    const counterEl = document.getElementById('counter');
    const captionEl = document.getElementById('caption');
    const uiOverlay = document.getElementById('ui-overlay');
    const btnAuto = document.getElementById('btn-auto');

    function parseCSV(text) {
      const rows = [];
      let row = [], col = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(col.trim()); col = ''; }
        else if ((c === '\n' || (c === '\r' && next === '\n')) && !inQuotes) {
          if (c === '\r') i++;
          row.push(col.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = []; col = '';
        } else { col += c; }
      }
      if (col || row.length) { row.push(col.trim()); rows.push(row); }
      return rows;
    }

    // Fisher-Yates shuffle untuk membuat siklus tanpa pengulangan
    function buildShuffledDeck(excludeIdx = -1) {
      const indices = [];
      for (let i = 0; i < allItems.length; i++) {
        indices.push(i);
      }
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      if (indices.length > 1 && indices[indices.length - 1] === excludeIdx) {
        [indices[indices.length - 1], indices[0]] = [indices[0], indices[indices.length - 1]];
      }
      shuffleDeck = indices;
    }

    function drawFromDeck(excludeIdx = -1) {
      if (allItems.length === 0) return -1;
      if (shuffleDeck.length === 0) {
        buildShuffledDeck(excludeIdx);
      }
      let idx = shuffleDeck.pop();
      if (idx === excludeIdx && shuffleDeck.length > 0) {
        const alt = shuffleDeck.pop();
        shuffleDeck.unshift(idx);
        idx = alt;
      }
      return idx;
    }

    function prepareNextRandom(currentIdx) {
      if (allItems.length <= 1) {
        nextBuffer = 0;
        return;
      }
      const nextIdx = drawFromDeck(currentIdx);
      nextBuffer = nextIdx;
      const preloader = new Image();
      preloader.src = allItems[nextIdx].url;
    }

    function clearAutoTimer() {
      if (autoTimer !== null) {
        clearTimeout(autoTimer);
        autoTimer = null;
      }
    }

    function scheduleAutoNext() {
      clearAutoTimer();
      if (!isAutoEnabled || allItems.length === 0) return;
      autoTimer = setTimeout(() => {
        goNext();
      }, AUTO_DELAY_MS);
    }

    function toggleAutoMode() {
      isAutoEnabled = !isAutoEnabled;
      btnAuto.classList.toggle('active', isAutoEnabled);
      btnAuto.textContent = isAutoEnabled ? 'Auto: On (3s)' : 'Auto: Off (3s)';
      if (isAutoEnabled) {
        scheduleAutoNext();
      } else {
        clearAutoTimer();
      }
    }

    function renderSlide(itemIdx, direction = 'none') {
      const item = allItems[itemIdx];
      if (!item) return;

      if (direction === 'next') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(40px)';
        imgEl.style.opacity = '0.3';
      } else if (direction === 'prev') {
        imgEl.style.transition = 'none';
        imgEl.style.transform = 'translateX(-40px)';
        imgEl.style.opacity = '0.3';
      }

      const startTimerAfterLoad = () => {
        scheduleAutoNext();
      };

      imgEl.onload = () => {
        statusEl.style.display = 'none';
        imgEl.style.display = 'block';
        requestAnimationFrame(() => {
          imgEl.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease';
          imgEl.style.transform = 'translateX(0)';
          imgEl.style.opacity = '1';
        });
        startTimerAfterLoad();
      };

      imgEl.onerror = () => {
        statusEl.style.display = 'block';
        statusEl.textContent = 'Gagal memuat gambar. Lanjut otomatis/geser...';
        imgEl.style.display = 'none';
        startTimerAfterLoad();
      };

      imgEl.src = item.url;
      captionEl.textContent = item.caption || '';

      const remainingInCycle = shuffleDeck.length + (nextBuffer !== null ? 1 : 0);
      counterEl.textContent = `Riwayat #${historyIndex + 1} • Sisa siklus: ${remainingInCycle}/${allItems.length}`;
    }

    function goNext() {
      if (allItems.length === 0) return;
      clearAutoTimer();

      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        renderSlide(historyStack[historyIndex], 'next');
        return;
      }

      const currentIdx = historyStack[historyIndex] ?? -1;
      const chosenIdx = (nextBuffer !== null && nextBuffer !== currentIdx)
        ? nextBuffer
        : drawFromDeck(currentIdx);

      nextBuffer = null;
      historyStack.push(chosenIdx);
      historyIndex = historyStack.length - 1;
      renderSlide(chosenIdx, 'next');
      prepareNextRandom(chosenIdx);
    }

    function goPrev() {
      if (allItems.length === 0) return;
      clearAutoTimer();
      if (historyIndex > 0) {
        historyIndex--;
        renderSlide(historyStack[historyIndex], 'prev');
      } else {
        const currentIdx = historyStack[0] ?? -1;
        const chosenIdx = drawFromDeck(currentIdx);
        historyStack.unshift(chosenIdx);
        renderSlide(chosenIdx, 'prev');
      }
    }

    // Gesture Swipe Jari
    let touchStartX = 0;
    let touchStartY = 0;
    let touchCurrentX = 0;
    let isSwiping = false;

    viewer.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchCurrentX = touchStartX;
      isSwiping = true;
      imgEl.style.transition = 'none';
    }, { passive: true });

    viewer.addEventListener('touchmove', (e) => {
      if (!isSwiping) return;
      touchCurrentX = e.touches[0].clientX;
      const deltaX = touchCurrentX - touchStartX;
      const deltaY = e.touches[0].clientY - touchStartY;

      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        imgEl.style.transform = `translateX(${deltaX * 0.45}px)`;
      }
    }, { passive: true });

    viewer.addEventListener('touchend', () => {
      if (!isSwiping) return;
      isSwiping = false;
      const deltaX = touchCurrentX - touchStartX;
      const threshold = 45;

      if (deltaX < -threshold) {
        goNext();
      } else if (deltaX > threshold) {
        goPrev();
      } else {
        imgEl.style.transition = 'transform 0.2s ease';
        imgEl.style.transform = 'translateX(0)';
      }
    });

    viewer.addEventListener('click', () => {
      if (Math.abs(touchCurrentX - touchStartX) < 10) {
        uiOverlay.classList.toggle('hidden');
      }
    });

    document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); goNext(); });
    document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); goPrev(); });
    btnAuto.addEventListener('click', (e) => { e.stopPropagation(); toggleAutoMode(); });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key.toLowerCase() === 'a') toggleAutoMode();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearAutoTimer();
      } else if (isAutoEnabled) {
        scheduleAutoNext();
      }
    });

    async function init() {
      try {
        const res = await fetch(CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          statusEl.textContent = 'Sheet kosong atau format CSV belum sesuai.';
          return;
        }

        const headers = rows[0].map(h => h.toLowerCase());
        const urlCol = headers.indexOf('url');
        const capCol = headers.indexOf('caption');

        if (urlCol === -1) {
          statusEl.textContent = 'Kolom dengan header "url" tidak ditemukan di baris 1.';
          return;
        }

        allItems = rows.slice(1)
          .map(r => ({
            url: r[urlCol] || '',
            caption: capCol !== -1 ? (r[capCol] || '') : ''
          }))
          .filter(item => item.url.startsWith('http'));

        if (allItems.length === 0) {
          statusEl.textContent = 'Tidak ada link gambar valid yang ditemukan.';
          return;
        }

        buildShuffledDeck(-1);
        goNext();
      } catch (err) {
        statusEl.textContent = 'Gagal mengambil data dari Google Sheets.';
      }
    }

    init();
  </script>
</body>
</html>
